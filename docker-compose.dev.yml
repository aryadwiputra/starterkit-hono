services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:./data.db
      - SESSION_SECRET=dev-secret-key-change-in-production
      - ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - .:/app
      - app-data:/app/data
    command: bun run dev

volumes:
  app-data:
